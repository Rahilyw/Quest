name: CI

on:
  push:
    branches: [main, 'cursor/**', 'claude/**']
  pull_request:
    branches: [main]

jobs:
  # Test files use relative requires only, so no install is needed. The workspace
  # `test` scripts list every test file; new files are picked up by adding them there.
  geofence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run geofence and redemption tests
        run: npm test --workspace @quest/geofence --ignore-scripts

  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run mobile tests (logic, quest window, recap, profile privacy)
        run: npm test --workspace mobile --ignore-scripts

  token-report:
    name: token report (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Raw token count
        run: node apps/mobile/scripts/check-tokens.js

  typescript-check-mobile:
    name: typescript-check (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: cd apps/mobile && npm install --ignore-scripts
      - name: TypeScript check
        run: cd apps/mobile && npx tsc --noEmit

  typescript-check-admin:
    name: typescript-check (admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: cd apps/admin && npm install
      - name: TypeScript check
        run: cd apps/admin && npx tsc --noEmit
      - name: Production build (placeholder env, no network secrets)
        run: cd apps/admin && npx next build
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SECRET_KEY: placeholder
          SUPABASE_PUBLISHABLE_KEY: placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          ADMIN_ALLOWED_EMAILS: ci@example.com
          NEXT_TELEMETRY_DISABLED: '1'

  dependency-audit:
    name: npm audit (production, critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
